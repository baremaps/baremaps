name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: github

      - name: Extract variables
        id: variables
        run: |
          git_tag="${GITHUB_REF#refs/tags/}"
          echo "git_tag=$git_tag" >> $GITHUB_OUTPUT
          echo "git_version=${git_tag#v}" >> $GITHUB_OUTPUT
          if [[ "$git_tag" == *-* ]]; then
            echo "prerelease=--prerelease" >> $GITHUB_OUTPUT
          else
            echo "prerelease=" >> $GITHUB_OUTPUT
          fi

      - name: Set the project version from the tag
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.variables.outputs.git_version }} -DgenerateBackupPoms=false

      - name: Build and publish Maven artifacts to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -V deploy -Prelease -DskipTests

      - name: Hash the archives
        working-directory: ./baremaps-cli/target
        run: |
          for kind in src bin; do
            shasum -a 512 "baremaps-${{ steps.variables.outputs.git_version }}-$kind.tar.gz" > "baremaps-${{ steps.variables.outputs.git_version }}-$kind.tar.gz.sha512"
          done

      - name: Draft the release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.variables.outputs.git_tag }}" --draft ${{ steps.variables.outputs.prerelease }} --title "Baremaps ${{ steps.variables.outputs.git_version }}" --repo ${{ github.repository }} --generate-notes
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-*.tar.gz*
