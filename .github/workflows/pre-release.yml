name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-test[0-9]+'
jobs:
  publish-pre-release:
    name: Publish pre-release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-username: NEXUS_USER
          server-password: NEXUS_PW
          gpg-private-key: ${{ secrets.BAREMAPS_GPG_SECRET_KEY }}

      - name: Extract variables
        id: variables
        run: |
          echo "git_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "git_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "mvn_version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Build pre-release
        run: mvn install -DskipTests -Dmaven.javadoc.skip=true -B -V

      - name: Set up GPG
        run: |
          echo "${{ secrets.BAREMAPS_GPG_SECRET_KEY }}" | gpg --batch --import
          gpg --list-keys
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Sign and hash pre-release
        run: |
          cd ./baremaps-cli/target
          mv baremaps-${{ steps.variables.outputs.mvn_version }}-src.tar.gz baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz
          shasum -a 512 "./baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz" > "./baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz.sha512"
          gpg --no-tty --quiet --pinentry-mode loopback --default-key "${{ secrets.GPG_KEY_ID }}" --batch --yes --output "./baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz.asc" --detach-sign --armor "./baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz"
          mv baremaps-${{ steps.variables.outputs.mvn_version }}-bin.tar.gz baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz
          shasum -a 512 "./baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz" > "./baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz.sha512"
          gpg --no-tty --quiet --pinentry-mode loopback --default-key "${{ secrets.GPG_KEY_ID }}" --batch --yes --output "./baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz.asc" --detach-sign --armor "./baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz"
          cd -

      - name: Publish pre-release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.variables.outputs.git_tag }}" --draft --prerelease --title "Baremaps ${{ steps.variables.outputs.git_version }}" --repo ${{ github.repository }} --generate-notes
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz.sha512
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-src.tar.gz.asc
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz.sha512
          gh release upload --clobber "${{ steps.variables.outputs.git_tag }}" ./baremaps-cli/target/baremaps-${{ steps.variables.outputs.git_version }}-bin.tar.gz.asc
